<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:#0B0B0C}
.wrap{position:relative;width:1024px;height:1024px;
  background:radial-gradient(ellipse 70% 55% at 50% 52%,rgba(255,107,26,.16),rgba(255,107,26,0) 70%),#0B0B0C}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 8px)}
.frame{position:absolute;left:96px;right:96px;top:96px;bottom:96px;border:6px solid rgba(255,107,26,.28)}
.line{position:absolute;left:0;right:0;top:50%;transform:translateY(-54%);display:flex;align-items:center;justify-content:center;
  font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-weight:700;font-size:250px;letter-spacing:-6px}
.chev{color:#FF6B1A;margin-right:36px;text-shadow:0 0 40px rgba(255,107,26,.55)}
.tmx{color:#F4F4EF;text-shadow:0 0 24px rgba(244,244,239,.18)}
.cur{display:inline-block;width:92px;height:200px;background:#FF6B1A;margin-left:22px;transform:translateY(10px);
  box-shadow:0 0 50px rgba(255,107,26,.7)}
</style></head><body><div class="wrap"><div class="frame"></div>
<div class="line"><span class="chev">❯</span><span class="tmx">tmx</span><span class="cur"></span></div>
<div class="scan"></div></div></body></html>
